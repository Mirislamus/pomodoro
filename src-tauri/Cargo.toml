[package]
name = "pomotomo"
version = "0.1.0"
description = "Pomotomo focus timer"
authors = ["Mirislamus"]
edition = "2021"

[lib]
name = "pomotomo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
