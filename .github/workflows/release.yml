name: Release desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundle: nsis
            output: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            asset: Pomotomo-windows-x64-setup.exe
          - platform: macos-latest
            target: aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
            bundle: dmg
            output: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            asset: Pomotomo-macos-arm64.dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: bun install

      - name: Build desktop app
        run: bun run tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Collect installer
        shell: bash
        run: |
          mkdir -p release
          cp ${{ matrix.output }} "release/${{ matrix.asset }}"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "Pomotomo $TAG" --generate-notes
          fi
          gh release upload "$TAG" release/* --clobber
